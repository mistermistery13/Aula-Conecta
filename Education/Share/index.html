<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aula Conecta - Comparte</title>
  <link rel="stylesheet" href="../MainFolder/mainCss.css" />
  <style>
    :root {
      --div-background-color: #273a6a;
      --border: 1px solid #40536e;
    }
    .panel {
      width: var(--panel-width, min(900px, 92vw));
      margin: 24px auto;
      padding: 24px;
      box-sizing: border-box;
      background: var(--div-background-color);
      border: var(--border);
      border-radius: 12px;
      color: #e0e6f0;
      font-family: Arial, sans-serif;
    }
    .field {
      background-color: var(--div-background-color);
      border: var(--border);
      color: #e0e6f0;
      padding: 10px;
      border-radius: 10px;
      font-size: 1rem;
      width: 100%;
      box-sizing: border-box;
      font-family: inherit;
      margin-top: 10px;
      resize: vertical;
    }
    .field::placeholder {
      color: #a0a9bf;
    }
    .btn {
      background-color: #a8f05a;
      color: #18210f;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      font-family: inherit;
      font-size: 1rem;
      transition: background-color 0.3s ease;
    }
    .btn:hover {
      background-color: #92cb4a;
    }
    .post {
      background-color: #1a2a52;
      border-radius: 10px;
      padding: 15px 18px;
      margin-top: 20px;
      box-shadow: inset 0 0 5px #a8f05a33;
      color: #f0f5fc;
      font-family: Arial, sans-serif;
    }
    .post-head {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .avatar {
      background-color: #a8f05a;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #18210f;
      font-family: Arial, sans-serif;
    }
    .post-head strong {
      font-weight: 700;
      font-size: 14px;
    }
    .post-head small {
      font-size: 12px;
      color: #84a1c1;
    }
    .post p {
      margin-top: 8px;
      font-size: 14px;
      color: #c8d0e7;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <section class="panel" id="community">
    <div class="section-head" style="margin-top:0">
      <div>
        <h2>Comparte con la comunidad</h2>
        <p>Un espacio para preguntar, intercambiar ideas y aprender en equipo.</p>
      </div>
    </div>
    <form class="post-form" id="postForm">
      <input class="field" id="postTitle" type="text" placeholder="Título de tu publicación" required />
      <textarea class="field" id="postBody" placeholder="¿Qué te gustaría compartir o preguntar?" required rows="5"></textarea>
      <div><button class="btn" type="submit">Publicar pregunta</button></div>
    </form>
    <div id="posts"></div>
  </section>

  <script>
    const postForm = document.getElementById('postForm');
    const postsContainer = document.getElementById('posts');

    postForm.addEventListener('submit', e => {
      e.preventDefault();

      const title = document.getElementById('postTitle').value.trim();
      const body = document.getElementById('postBody').value.trim();

      if (!title || !body) return;

      const post = document.createElement('article');
      post.className = 'post';
      post.innerHTML = `
        <div class="post-head">
          <div class="avatar">T</div>
          <div>
            <strong>Tu publicación</strong><br>
            <small>Comunidad · Ahora</small>
          </div>
        </div>
        <p><strong>${escapeHtml(title)}</strong><br>${escapeHtml(body)}</p>
      `;

      postsContainer.prepend(post);
      postForm.reset();
    });

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, c => (
        {'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'": '&#39;'}[c]
      ));
    }
  </script>
</body>
</html>
